screencopy {
    # Intel+NVIDIA laptop: some apps (e.g. GajiHub TimeTracker) can't import the DMA-BUF frames
    # and capture blank screens. SHM is a bit slower but works for every screen-share client.
    force_shm = true
    # Pre-tick "Allow a restore token" so apps like GajiHub don't re-ask after every restart
    allow_token_by_default = true
}
