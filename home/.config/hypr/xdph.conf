screencopy {
    # Intel+NVIDIA laptop: some screen-capture apps (time trackers, meeting apps) can't import the DMA-BUF frames
    # and capture blank screens. SHM is a bit slower but works for every screen-share client.
    force_shm = true
    # Pre-tick "Allow a restore token" so screen-capture apps don't re-ask after every restart
    allow_token_by_default = true
}
